kind = "web"
previewPath = "/"
title = "SpiderSmm"
description = "A runnable Arabic social media marketing service panel based on the attached Python application, including account access, service ordering, order history, settings, and administration tools."
version = "1.0.0"
id = "artifacts/spider-smm"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 23406

[services.development]
run = "pnpm --filter @workspace/spider-smm run dev"

[services.production.build]
args = ["python3", "-m", "py_compile", "artifacts/spider-smm/main.py"]

[services.production.run]
args = ["python3", "artifacts/spider-smm/main.py"]

[services.production.run.env]
PORT = "23406"

[services.env]
PORT = "23406"
BASE_PATH = "/"
